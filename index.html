<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 产品经理 · 个人主页</title>
  <meta name="description" content="AI 产品经理个人网站：项目作品集、专业技能与联系方式。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <!-- 顶部导航 -->
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="#top" class="nav-logo" id="navLogo">AI PM</a>

      <div class="nav-links" id="navLinks">
        <a href="#about">关于我</a>
        <a href="#projects">项目</a>
        <a href="#skills">技能</a>
        <a href="#contact">联系</a>
      </div>

      <div class="nav-actions">
        <a href="#" class="nav-gh" id="navGithub" target="_blank" rel="noopener">
          GitHub
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero" id="top">
    <div class="hero-inner">
      <p class="hero-eyebrow reveal" id="heroEyebrow">AI 产品经理 · 求职中</p>
      <h1 class="hero-name reveal" id="heroName">你的名字</h1>
      <p class="hero-tagline reveal" id="heroTagline">用 AI 打造真正好用的产品。</p>
      <div class="hero-actions reveal">
        <a href="#projects" class="btn btn-primary">查看项目</a>
        <a href="#contact" class="btn btn-outline">联系我</a>
      </div>
    </div>
    <div class="hero-visual reveal" aria-hidden="true">
      <div class="hero-orb"></div>
    </div>
  </header>

  <!-- 关于我 -->
  <section class="section" id="about">
    <div class="container">
      <p class="section-eyebrow reveal">关于我</p>
      <h2 class="section-title reveal">一句话介绍</h2>
      <div class="about-body">
        <p class="about-text reveal" id="aboutText">
          我是一名专注于 AI 领域的产品经理，相信好的产品源于对用户与技术的双重理解。这里收录了我的项目作品与技能，欢迎了解。
        </p>
        <div class="about-highlights reveal" id="aboutHighlights"></div>
      </div>
    </div>
  </section>

  <!-- 项目 -->
  <section class="section section-frost" id="projects">
    <div class="container">
      <p class="section-eyebrow reveal">项目作品</p>
      <h2 class="section-title reveal">我做过的事</h2>
      <p class="section-sub reveal">点击卡片，跳转到 GitHub 查看对应项目详情。</p>
      <div class="projects-grid" id="projectsGrid"></div>
    </div>
  </section>

  <!-- 技能 -->
  <section class="section" id="skills">
    <div class="container">
      <p class="section-eyebrow reveal">专业技能</p>
      <h2 class="section-title reveal">我的技能栈</h2>
      <div class="skills-list" id="skillsList"></div>
    </div>
  </section>

  <!-- 联系 -->
  <section class="section section-ice" id="contact">
    <div class="container contact-inner">
      <p class="section-eyebrow reveal">联系我</p>
      <h2 class="section-title reveal" id="contactTitle">让我们一起打造好产品</h2>
      <p class="section-sub reveal" id="contactSub">对 AI 产品感兴趣？欢迎通过邮件或 GitHub 联系我。</p>
      <div class="contact-actions reveal">
        <a href="#" class="btn btn-primary" id="contactEmail">发送邮件</a>
        <a href="#" class="btn btn-outline" id="contactGithub" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <div class="footer-links" id="footerLinks"></div>
      <p class="footer-fine" id="footerFine">© 2025 · AI 产品经理</p>
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
